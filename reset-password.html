<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password</title><link rel="stylesheet" href="css/styles.css"><script src="js/sheets-config.js"></script><script src="js/sheets-client.js"></script></head>
<body><main class="login-shell"><div class="login-card"><h1>Set a new password</h1><form id="resetForm"><div class="field"><label for="newPassword">New password (at least 12 characters)</label><input id="newPassword" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></div><button class="btn btn-primary">Save password</button></form><p id="result" role="status"></p><a href="login.html">Return to sign in</a></div></main>
<script>
const token = location.hash.slice(1); history.replaceState(null, '', location.pathname);
document.getElementById('resetForm').addEventListener('submit', async event => {
  event.preventDefault(); const button = event.target.querySelector('button'); button.disabled = true;
  try { await SheetsBackend.call('resetConfirm', { token, password: document.getElementById('newPassword').value }); document.getElementById('result').textContent = 'Password updated. You can now sign in.'; event.target.hidden = true; }
  catch (err) { document.getElementById('result').textContent = err.message; button.disabled = false; }
});
</script></body></html>
