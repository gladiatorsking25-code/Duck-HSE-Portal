<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/consent.js"></script>
<script>requireConsent();</script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/subscription-config.js"></script>
<script src="js/entitlements.js"></script>
<script src="js/access.js"></script>
<script>requireAccess();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment History · Duck HSE Portal</title>
<link rel="stylesheet" href="css/styles.css">
<!-- Installable-app / PWA metadata (see manifest.webmanifest, sw.js, js/pwa.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16283a">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duck HSE">
<meta name="description" content="Crane load-chart assessments, lift diagrams, pre-lift briefings and lifting permits, aligned with ADOSH-SF CoP 34.0. A planning aid, not a replacement for the certified load chart or an Appointed Person's sign-off.">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<script src="js/app-version.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h2>Assessment history</h2>
        <div class="crumb">All saved lift assessments</div>
      </div>
      <a class="btn btn-primary" href="assessment.html">+ New assessment</a>
    </div>

    <div class="content">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search crane, assessor, notes…">
        <select id="filterResult">
          <option value="">All results</option>
          <option value="pass">Allowed only</option>
          <option value="fail">Not allowed only</option>
        </select>
        <select id="filterCrane"><option value="">All cranes</option></select>
        <div class="spacer"></div>
        <button class="btn" id="btnExportCsv">Export CSV</button>
      </div>

      <div id="tableWrap"></div>
      <div id="app-footer"></div>
    </div>
  </div>
</div>

<div id="lightboxRoot"></div>

<script src="js/crane-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/lift-planning.js"></script>
<script src="js/assessment-detail.js"></script>
<script>
renderSidebar('history');
renderFooter('app-footer');

const filterCrane = document.getElementById('filterCrane');
filterCrane.innerHTML += Object.keys(CRANE_DATA).map(m => `<option value="${m}">${m}</option>`).join('');

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const resultFilter = document.getElementById('filterResult').value;
  const craneFilter = filterCrane.value;

  let list = DB.getAssessments().sort((a,b) => new Date(b.date) - new Date(a.date));
  list = list.filter(a => {
    if (craneFilter && a.craneModel !== craneFilter) return false;
    if (resultFilter === 'pass' && !a.isValid) return false;
    if (resultFilter === 'fail' && a.isValid) return false;
    if (search) {
      const hay = `${a.craneModel} ${a.assessorName||''} ${a.notes||''} ${a.configuration||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const wrap = document.getElementById('tableWrap');
  if (!list.length) {
    wrap.innerHTML = `<div class="card empty-state"><div class="icon">📋</div>No assessments match these filters.</div>`;
    return;
  }

  wrap.innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Date</th><th>Crane</th><th>Config</th><th>Load (t)</th><th>Radius / Angle</th><th>Boom (m)</th>
        <th>Wind (m/s)</th><th>Util.</th><th>Result</th><th>Assessed by</th><th></th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(a => `
          <tr>
            <td class="num">${fmtDate(a.date)}</td>
            <td>${a.craneModel}</td>
            <td>${a.configuration}</td>
            <td class="num">${a.loadWeight.toFixed(1)}</td>
            <td class="num">${a.jibMode ? `${a.boomAngle.toFixed(1)}° (${a.jibLength}m jib, ${a.jibOffset}° offset)` : (a.workingRadius != null ? a.workingRadius.toFixed(1) + ' m' : '—')}</td>
            <td class="num">${a.boomLength != null ? a.boomLength.toFixed(1) : '—'}</td>
            <td class="num">${a.windSpeed.toFixed(1)}</td>
            <td class="num">${a.utilization < 999 ? a.utilization.toFixed(0)+'%' : '—'}</td>
            <td>${a.isValid ? '<span class="badge badge-ok"><span class="badge-dot"></span>Allowed</span>' : '<span class="badge badge-fail"><span class="badge-dot"></span>Not allowed</span>'}</td>
            <td>${a.assessorName || '—'}</td>
            <td><button class="btn btn-sm btn-primary" onclick="viewAssessment('${a.id}')">View full assessment</button></td>
            <td><button class="btn btn-sm btn-danger" onclick="removeAssessment('${a.id}')">Delete</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function removeAssessment(id) {
  if (!confirm('Delete this assessment record? This cannot be undone.')) return;
  DB.deleteAssessment(id);
  render();
}

// Kept available in case anything else links straight to the diagrams —
// viewAssessment() below now covers this plus every other field.
function viewDiagram(id) {
  const a = DB.getAssessments().find(x => x.id === id);
  if (!a) return;
  const shots = [
    a.diagram3D ? { src: a.diagram3D, label: '3D view' } : null,
    a.diagramSketch ? { src: a.diagramSketch, label: 'Plan sketch' } : null,
  ].filter(Boolean);
  if (!shots.length) return;
  const root = document.getElementById('lightboxRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="lightboxBackdrop">
      <div class="modal" style="max-width:820px;">
        <div class="modal-head">
          <strong>${a.craneModel} — ${fmtDate(a.date)}</strong>
          <button class="close-x" id="lightboxClose">&times;</button>
        </div>
        <div class="modal-body" style="display:flex; gap:14px; flex-wrap:wrap;">
          ${shots.map(s => `
            <div style="flex:1; min-width:280px;">
              <img class="lightbox-img" src="${s.src}" alt="${s.label}">
              <div style="text-align:center; margin-top:6px;">
                <span class="hint">${s.label}</span>
                <a class="btn btn-sm" style="margin-left:8px;" href="${s.src}" download="${a.id}-${s.label.replace(/\s+/g,'-').toLowerCase()}.png">Download</a>
              </div>
            </div>`).join('')}
        </div>
        <div class="modal-foot"><button class="btn btn-sm" id="lightboxClose2">Close</button></div>
      </div>
    </div>`;
  const close = () => { root.innerHTML = ''; };
  document.getElementById('lightboxClose').addEventListener('click', close);
  document.getElementById('lightboxClose2').addEventListener('click', close);
  document.getElementById('lightboxBackdrop').addEventListener('click', (e) => { if (e.target.id === 'lightboxBackdrop') close(); });
}

// Full detailed assessment view. The rendering now lives in
// js/assessment-detail.js so permit.html (and anything added later) can show the
// exact same record layout, and so records saved before the briefing/training/
// exclusion-zone fields existed get those sections recomputed instead of
// rendering as an almost-empty page with just the two diagrams.
function viewAssessment(id) {
  const a = DB.getAssessments().find(x => x.id === id);
  if (!a) return;
  AssessmentDetail.openModal(a, 'lightboxRoot');
}

// The previous, inline version of the detail view. Superseded by
// AssessmentDetail.openModal() above but kept intact and callable.
function viewAssessmentBasic(id) {
  const a = DB.getAssessments().find(x => x.id === id);
  if (!a) return;

  const spec = CRANE_DATA[a.craneModel];
  const env = a.environment || {};
  const training = a.trainingRequirements || [];
  const briefing = a.briefingPoints || [];
  const linkedPermit = DB.getPermits().find(p => p.assessmentId === a.id) || null;

  const shots = [
    a.diagram3D ? { src: a.diagram3D, label: '3D view' } : null,
    a.diagramSketch ? { src: a.diagramSketch, label: 'Plan sketch' } : null,
  ].filter(Boolean);

  const paramRows = [
    ['Crane model', a.craneModel],
    ['Configuration', a.configuration],
    ['Load weight', `${a.loadWeight.toFixed(2)} t`],
    a.jibMode
      ? ['Boom angle / jib', `${a.boomAngle.toFixed(1)}° · ${a.jibLength} m jib · ${a.jibOffset}° offset`]
      : ['Working radius', a.workingRadius != null ? `${a.workingRadius.toFixed(1)} m` : '—'],
    ['Boom length', a.boomLength != null ? `${a.boomLength.toFixed(2)} m` : `${(spec ? spec.maxBoomLength : '—')} m (full boom + jib)`],
    ['Wind speed', `${a.windSpeed.toFixed(1)} m/s`],
    ['Wind / slew direction', (a.windDirection != null || a.slewDirection != null) ? `Wind ${a.windDirection ?? '—'}° · Slew ${a.slewDirection ?? '—'}°` : '—'],
    ['Chart capacity at this point', `${a.maximumCapacity.toFixed(2)} t`],
    ['Utilization', a.utilization < 999 ? `${a.utilization.toFixed(0)}%` : '—'],
  ];

  const envRows = [
    ['Visibility', env.visibility ? LiftPlanning.envLabel('visibility', env.visibility) : '—'],
    ['Precipitation', env.precipitation ? LiftPlanning.envLabel('precipitation', env.precipitation) : '—'],
    ['Lighting', env.lighting ? LiftPlanning.envLabel('lighting', env.lighting) : '—'],
    ['Ground conditions', env.ground ? LiftPlanning.envLabel('ground', env.ground) : '—'],
    ['Load largest dimension', env.loadDimensionM ? `${env.loadDimensionM.toFixed(1)} m` : '—'],
  ];

  const root = document.getElementById('lightboxRoot');
  root.innerHTML = `
    <div class="modal-backdrop" id="assessBackdrop">
      <div class="modal" id="assessModal" style="max-width:920px;">
        <div class="modal-head">
          <div>
            <strong>${a.craneModel} — ${fmtDate(a.date)}</strong>
            <div class="hint">Assessed by ${a.assessorName || '—'}</div>
          </div>
          <button class="close-x no-print" id="assessClose">&times;</button>
        </div>
        <div class="modal-body">
          <div class="result-panel" style="margin-top:0;">
            <div class="result-head ${a.isValid ? 'ok' : 'fail'}">
              <div class="verdict">${a.isValid ? '✓ Lift was allowed' : '✕ Lift was not allowed'}</div>
              <div class="util">${a.utilization < 999 ? a.utilization.toFixed(0) + '%' : '—'} of capacity</div>
            </div>
          </div>

          <div class="section-title">Lift parameters</div>
          <table class="spec-table">
            ${paramRows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
          </table>

          <div class="section-title">Environment & site conditions</div>
          <table class="spec-table">
            ${envRows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('')}
          </table>

          ${a.exclusionZoneM != null || a.exclusionZoneNote ? `
            <div class="section-title">Exclusion zone</div>
            ${a.exclusionZoneM != null ? `<div class="exclusion-figure">${a.exclusionZoneM} m</div>` : ''}
            <p class="hint">${a.exclusionZoneNote || ''}</p>
          ` : ''}

          ${briefing.length ? `
            <div class="section-title">Pre-lift briefing</div>
            <ol class="briefing-list">${briefing.map(pt => `<li>${pt}</li>`).join('')}</ol>
          ` : ''}

          ${training.length ? `
            <div class="section-title">Training requirements</div>
            ${training.map(t => `
              <div class="card" style="margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                  <strong>${t.category}</strong>
                  <span class="badge ${t.required ? 'badge-warn' : 'badge-neutral'}"><span class="badge-dot"></span>${t.required ? 'Mandatory for this lift' : 'Recommended'}</span>
                </div>
                <ul class="briefing-list" style="margin:0;">${t.items.map(i => `<li>${i}</li>`).join('')}</ul>
              </div>
            `).join('')}
          ` : ''}

          ${shots.length ? `
            <div class="section-title">Lift diagrams</div>
            <div style="display:flex; gap:14px; flex-wrap:wrap;">
              ${shots.map(s => `
                <div style="flex:1; min-width:280px;">
                  <img class="lightbox-img" src="${s.src}" alt="${s.label}">
                  <div style="text-align:center; margin-top:6px;">
                    <span class="hint">${s.label}</span>
                    <a class="btn btn-sm no-print" style="margin-left:8px;" href="${s.src}" download="${a.id}-${s.label.replace(/\s+/g,'-').toLowerCase()}.png">Download</a>
                  </div>
                </div>`).join('')}
            </div>
          ` : ''}

          ${a.notes ? `
            <div class="section-title">Notes</div>
            <p style="white-space:pre-wrap; font-size:13.5px;">${a.notes}</p>
          ` : ''}

          ${linkedPermit ? `
            <div class="section-title">Linked permit</div>
            <div class="banner banner-info no-print">
              This assessment is linked to permit <strong class="num">${linkedPermit.permitNumber}</strong>.
              <a class="btn btn-sm" style="margin-left:8px;" href="permit.html?id=${linkedPermit.id}&mode=view">View permit</a>
            </div>
          ` : ''}
        </div>
        <div class="modal-foot no-print">
          <button class="btn btn-sm" id="assessPrint">Print / save as PDF</button>
          <button class="btn btn-sm" id="assessClose2">Close</button>
        </div>
      </div>
    </div>`;

  const close = () => { root.innerHTML = ''; };
  document.getElementById('assessClose').addEventListener('click', close);
  document.getElementById('assessClose2').addEventListener('click', close);
  document.getElementById('assessBackdrop').addEventListener('click', (e) => { if (e.target.id === 'assessBackdrop') close(); });
  document.getElementById('assessPrint').addEventListener('click', () => {
    document.body.classList.add('printing-modal');
    window.print();
  });
  window.addEventListener('afterprint', () => document.body.classList.remove('printing-modal'), { once: true });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterResult').addEventListener('change', render);
filterCrane.addEventListener('change', render);

document.getElementById('btnExportCsv').addEventListener('click', () => {
  const rows = [['Date','Crane Model','Configuration','Load Weight (t)','Working Radius (m)','Boom Angle (deg)','Jib Length (m)','Jib Offset (deg)','Boom Length (m)','Wind Speed (m/s)','Max Capacity (t)','Utilization (%)','Result','Assessed By','Notes']];
  DB.getAssessments().forEach(a => rows.push([
    a.date, a.craneModel, a.configuration, a.loadWeight,
    a.jibMode ? '' : a.workingRadius, a.jibMode ? a.boomAngle : '', a.jibMode ? a.jibLength : '', a.jibMode ? a.jibOffset : '',
    a.boomLength, a.windSpeed, a.maximumCapacity.toFixed(2), a.utilization.toFixed(1), a.isValid ? 'ALLOWED' : 'NOT ALLOWED',
    a.assessorName || '', (a.notes||'').replace(/\n/g,' ')
  ]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lift-assessments-${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
});

render();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
