<!DOCTYPE html>
<html lang="en">
<head>
<script src="js/consent.js"></script>
<script>requireConsent();</script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/subscription-config.js"></script>
<script src="js/entitlements.js"></script>
<script src="js/access.js"></script>
<script>requireAccess();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Permits · Duck HSE Portal</title>
<link rel="stylesheet" href="css/styles.css">
<!-- Installable-app / PWA metadata (see manifest.webmanifest, sw.js, js/pwa.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16283a">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Duck HSE">
<meta name="description" content="Crane load-chart assessments, lift diagrams, pre-lift briefings and permits to work, aligned with ADOSH-SF CoP 34.0. A planning aid — not a replacement for the certified load chart or an Appointed Person's sign-off.">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon-180.png">
<script src="js/app-version.js"></script>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <div class="topbar">
      <div>
        <h2>Lifting permits</h2>
        <div class="crumb">All permits on file</div>
      </div>
      <a class="btn btn-primary" href="permit.html">+ New permit</a>
    </div>

    <div class="content">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search permit #, project, location, PIC…">
        <select id="filterStatus">
          <option value="">All statuses</option>
          <option value="active">Active</option>
          <option value="expired">Expired</option>
          <option value="suspended">Suspended</option>
        </select>
        <select id="filterType">
          <option value="">All lift types</option>
          <option value="critical">Critical only</option>
          <option value="noncritical">Non-critical only</option>
        </select>
      </div>
      <div id="tableWrap"></div>
      <div id="app-footer"></div>
    </div>
  </div>
</div>

<script src="js/crane-data.js"></script>
<script src="js/storage.js"></script>
<script src="js/cloud-sync.js"></script>
<script src="js/nav.js"></script>
<script>
renderSidebar('permits');
renderFooter('app-footer');

function statusOf(p) {
  if (p.status === 'suspended') return 'suspended';
  if (p.validTo && new Date(p.validTo) < new Date()) return 'expired';
  return 'active';
}
function statusBadge(s) {
  if (s === 'suspended') return '<span class="badge badge-fail"><span class="badge-dot"></span>Suspended</span>';
  if (s === 'expired') return '<span class="badge badge-neutral"><span class="badge-dot"></span>Expired</span>';
  return '<span class="badge badge-ok"><span class="badge-dot"></span>Active</span>';
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const statusFilter = document.getElementById('filterStatus').value;
  const typeFilter = document.getElementById('filterType').value;

  let list = DB.getPermits().sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
  list = list.filter(p => {
    const s = statusOf(p);
    if (statusFilter && s !== statusFilter) return false;
    if (typeFilter === 'critical' && !p.isCriticalLift) return false;
    if (typeFilter === 'noncritical' && p.isCriticalLift) return false;
    if (search) {
      const hay = `${p.permitNumber} ${p.projectNumber||''} ${p.location||''} ${p.personInCharge||''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  const wrap = document.getElementById('tableWrap');
  if (!list.length) {
    wrap.innerHTML = `<div class="card empty-state"><div class="icon">📄</div>No permits match these filters. <a href="permit.html">Create one</a>.</div>`;
    return;
  }
  wrap.innerHTML = `
    <table class="data-table">
      <thead><tr>
        <th>Permit #</th><th>Project</th><th>Location</th><th>PIC</th><th>Type</th><th>Valid to</th><th>Status</th><th></th>
      </tr></thead>
      <tbody>
        ${list.map(p => `
          <tr>
            <td class="num">${p.permitNumber}</td>
            <td>${p.projectNumber || '—'}</td>
            <td>${p.location || '—'}</td>
            <td>${p.personInCharge || '—'}</td>
            <td>${p.isCriticalLift ? '<span class="badge badge-warn"><span class="badge-dot"></span>Critical</span>' : 'Non-critical'}</td>
            <td class="num">${p.validTo ? fmtDate(p.validTo) : '—'}</td>
            <td>${statusBadge(statusOf(p))}</td>
            <td style="white-space:nowrap;">
              <a class="btn btn-sm" href="permit.html?id=${p.id}&mode=view">View</a>
              <a class="btn btn-sm" href="permit.html?id=${p.id}">Edit</a>
              <button class="btn btn-sm btn-danger" onclick="removePermit('${p.id}')">Delete</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function removePermit(id) {
  if (!confirm('Delete this permit? This cannot be undone.')) return;
  DB.deletePermit(id);
  render();
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('filterStatus').addEventListener('change', render);
document.getElementById('filterType').addEventListener('change', render);
render();
</script>
<script src="js/pwa.js"></script>
</body>
</html>
